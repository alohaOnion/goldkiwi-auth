name: CI - Build & Push to Harbor (branch->project mapping)

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["ops", "develop", "main"]

permissions:
  contents: read

concurrency:
  group: ci-harbor-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: be-auth-node-22.10
  DOCKERFILE_PATH: ./docker/Dockerfile
  BUILD_CONTEXT: .

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Harbor project by branch
        id: proj
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          case "${BRANCH}" in
            ops)
              HARBOR_PROJECT="goldkiwi-auth"
              ;;
            develop)
              HARBOR_PROJECT="goldkiwi-auth-dev"
              ;;
            main)
              HARBOR_PROJECT="goldkiwi-auth-prod"
              ;;
            *)
              echo "Unsupported branch: ${BRANCH}" >&2
              exit 1
              ;;
          esac

          echo "harbor_project=${HARBOR_PROJECT}" >> $GITHUB_OUTPUT

      - name: Login to Harbor (push only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          DATE_YYYYMMDD="$(date -u +%Y%m%d)"
          RUN_NUMBER="${GITHUB_RUN_NUMBER}"
      
          IMAGE="${{ secrets.HARBOR_REGISTRY }}/${{ steps.proj.outputs.harbor_project }}/${{ env.IMAGE_NAME }}"
      
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "tag_release=${DATE_YYYYMMDD}-${RUN_NUMBER}.${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "tag_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build (PR - no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: linux/amd64
          push: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push (ops/develop/main)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_release }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
